
name: Reusable GitOps Deployment

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

      gitops_repo:
        required: true
        type: string

      values_path:
        required: true
        type: string

      image_repository:
        required: true
        type: string

      image_tag:
        required: true
        type: string

    secrets:
      ARGOCD_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          ref: main
          path: gitops
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}

      - name: Install PyYAML
        run: |
          python3 -m pip install PyYAML==6.0.2

      - name: Update Helm image values
        env:
          VALUES_PATH: ${{ inputs.values_path }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        working-directory: gitops
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          root = Path.cwd().resolve()
          path = (root / os.environ["VALUES_PATH"]).resolve()

          if not path.is_relative_to(root):
              raise SystemExit("Invalid values path")

          values = yaml.safe_load(path.read_text())

          if not isinstance(values, dict):
              raise SystemExit("Invalid Helm values file")

          image = values.get("image")

          if not isinstance(image, dict):
              raise SystemExit("Missing image configuration")

          image["repository"] = os.environ["IMAGE_REPOSITORY"]
          image["tag"] = os.environ["IMAGE_TAG"]

          path.write_text(
              yaml.safe_dump(values, sort_keys=False)
          )
          PY

      - name: Commit and push
        working-directory: gitops
        env:
          APP: ${{ inputs.app }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VALUES_PATH: ${{ inputs.values_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$VALUES_PATH"

          if git diff --cached --quiet; then
            echo "No GitOps changes"
            exit 0
          fi

          git commit -m "chore(dev): deploy ${APP} ${IMAGE_TAG}"

          git pull --rebase origin main
          git push origin HEAD:main
